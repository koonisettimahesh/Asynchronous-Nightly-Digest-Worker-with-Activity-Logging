services:
  app:
    build: .
    container_name: app
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      PORT: ${PORT}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      NIGHTLY_DIGEST_CRON: ${NIGHTLY_DIGEST_CRON}
    depends_on:
      db:
        condition: service_healthy
      queue:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || curl -fsS http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  worker:
    build: .
    container_name: worker
    command: npm run worker
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    depends_on:
      db:
        condition: service_healthy
      queue:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep node | grep -v grep > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  db:
    image: postgres:17
    container_name: db
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/models/jobs.sql:/docker-entrypoint-initdb.d/01-jobs.sql
      - ./src/models/job_activity_logs.sql:/docker-entrypoint-initdb.d/02-job-activity-logs.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  queue:
    image: redis:7-alpine
    container_name: queue
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - queuedata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  pgdata:
  queuedata:
